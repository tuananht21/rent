services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: renthouse_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - renthouse-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: renthouse_backend
    ports:
      - "5000:3000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - renthouse-network

networks:
  renthouse-network:
    driver: bridge
