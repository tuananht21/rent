services:
  backend:
    build: ./backend
    container_name: rent_backend
    ports:
      - "5000:3000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - rent_network

  frontend:
    build: ./frontend
    container_name: rent_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - rent_network

networks:
  rent_network:
    driver: bridge